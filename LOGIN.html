<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
    
    <link rel="stylesheet" href="CSS WEB/login.css">
</head>

<body>

    <div class="contenedor">

        <h1>Iniciar sesión</h1>

        <p>Ingresa tus datos para acceder a tu cuenta.</p>

        <form>

            <label for="usuario">Usuario o Correo:</label>
            <br>
            <input type="text" id="usuario o correo" name="usuario o correo"
                placeholder="Escribe tu usuario o correo">
            <br><br>

            <label for="password">Contraseña:</label>
            <br>
            <input type="password" id="password" name="password"
                placeholder="Escribe tu contraseña">
            <br><br>

            <input type="submit" value="Ingresar">
            <input type="reset" value="Limpiar">

        </form>

        <br>
        <img src="logoNexuSec.png" alt="Logo de la página" class="logo">

        <p>
            ¿No tienes una cuenta?
            <a href="Crear Usuarios.html">Crear una cuenta</a>
        </p>

        <a href="index.html">Volver al inicio</a>

    </div>

</body>

</html>
