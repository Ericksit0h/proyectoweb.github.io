<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Crear usuario</title>

    <link rel="stylesheet" href="CSS WEB/crear usuarios.css">
</head>

<body>

    <div class="contenedor">

        

        <h1>Crear usuario</h1>

        <p>
            Completa el siguiente formulario para crear una nueva cuenta.
        </p>

        <form>

            <label for="nombre">Nombre:</label>
            <br>
            <input type="text" id="nombre" name="nombre"
                placeholder="Escribe tu nombre" required>
            <br><br>

            <label for="usuario">Usuario:</label>
            <br>
            <input type="text" id="usuario" name="usuario"
                placeholder="Crea un nombre de usuario" required>
            <br><br>

            <label for="correo">Correo electrónico:</label>
            <br>
            <input type="email" id="correo" name="correo"
                placeholder="ejemplo@correo.com" required>
            <br><br>

            <label for="password">Contraseña:</label>
            <br>
            <input type="password" id="password" name="password"
                placeholder="Crea una contraseña" required>
            <br><br>

            <label for="confirmar">Confirmar contraseña:</label>
            <br>
            <input type="password" id="confirmar" name="confirmar"
                placeholder="Repite tu contraseña" required>
            <br><br>

            <input type="submit" value="Crear usuario">
            <input type="reset" value="Limpiar">

        </form>

        <br>

        <img src="logoNexuSec.png" alt="Logo de la página" class="logo">

        <p>
            ¿Ya tienes una cuenta?
            <a href="login.html">Iniciar sesión</a>
        </p>

        <a href="index.html">Volver al inicio</a>

    </div>

</body>

</html>
