<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Contactos</title>

    <link rel="stylesheet" href="CSS WEB/contactos.css">
</head>

<body>

    <div class="contenedor">

        <h1>Contáctanos</h1>

        <p>
            Completa el siguiente formulario para ponerte en contacto
            con nosotros. Estaremos encantados de ayudarte.
        </p>

        <form>

            <label for="Nombres">Nombres:</label>
            <br>
            <input type="text" id="Nombres" name="Nombres"
                placeholder="Escribe tus Nombres">
            <br><br>

            <label for="Apellidos">Apellidos:</label>
            <br>
            <input type="text" id="apellidos" name="apellidos"
                placeholder="Escribe tus apellidos">
            <br><br>

            <label for="correo">Correo electrónico:</label>
            <br>
            <input type="email" id="correo" name="correo"
                placeholder="ejemplo@correo.com">
            <br><br>

            <label for="telefono">Teléfono:</label>
            <br>
            <input type="text" id="telefono" name="telefono"
                placeholder="Escribe tu teléfono">
            <br><br>

            <label for="asunto">Asunto:</label>
            <br>
            <input type="text" id="asunto" name="asunto"
                placeholder="Motivo de contacto">
            <br><br>

            <label for="mensaje">Mensaje:</label>
            <br>
            <textarea id="mensaje" name="mensaje"
                rows="6" cols="40"
                placeholder="Escribe tu mensaje aquí"></textarea>
            <br><br>

            <input type="submit" value="Enviar mensaje">
            <input type="reset" value="Limpiar">

        </form>

        <br>
        <img src="logoNexuSec.png" alt="Logo de la página" class="logo">

        <a href="index.html">Volver al inicio</a>

    </div>

</body>

</html>
